<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Macro Tracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F8BFF"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- calorie ring, open at the top like the tracker's hero ring -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="#FFFFFF" stroke-opacity=".26" stroke-width="42"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#FFFFFF" stroke-width="42" stroke-linecap="round"
          stroke-dasharray="829.4" stroke-dashoffset="207.4" transform="rotate(-90 256 256)"/>
</svg>
