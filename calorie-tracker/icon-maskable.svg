<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Macro Tracker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F8BFF"/>
    </linearGradient>
  </defs>
  <!-- full bleed: launchers crop this to their own shape -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- artwork kept inside the 80% safe zone -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#FFFFFF" stroke-opacity=".26" stroke-width="32"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"
          stroke-dasharray="628.3" stroke-dashoffset="157.1" transform="rotate(-90 256 256)"/>
</svg>
