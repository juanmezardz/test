name: Publish game to GitHub Pages

on:
  push:
    branches: [claude/multiplication-game-concept-8zd6fu]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy game to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git checkout gh-pages
          git checkout "${{ github.sha }}" -- index.html
          if git diff --cached --quiet; then
            echo "Sin cambios en el juego"
          else
            git commit -m "Update game from ${{ github.sha }}"
            git push origin gh-pages
          fi
