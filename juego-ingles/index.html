<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Party · Juego de inglés</title>
<style>
  :root {
    --bg: #f4f1fb;
    --bg-2: #e8f4ff;
    --card: #ffffff;
    --text: #241c3b;
    --muted: #6b6484;
    --line: #e6e1f2;
    --primary: #6c5ce7;
    --primary-soft: #efecff;
    --accent: #00b894;
    --accent-soft: #e2f7f1;
    --warn: #f6b93b;
    --danger: #ff6b6b;
    --danger-soft: #ffecec;
    --shadow: 0 10px 30px rgba(60, 40, 120, .12);
    --radius: 22px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16132a;
      --bg-2: #101a2b;
      --card: #211d3a;
      --text: #f2eeff;
      --muted: #a49ec2;
      --line: #332c55;
      --primary: #9b8bff;
      --primary-soft: #2c2552;
      --accent: #2fd6ac;
      --accent-soft: #1c3f39;
      --danger: #ff8787;
      --danger-soft: #47262c;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f1fb; --bg-2: #e8f4ff; --card: #fff; --text: #241c3b; --muted: #6b6484;
    --line: #e6e1f2; --primary: #6c5ce7; --primary-soft: #efecff; --accent: #00b894;
    --accent-soft: #e2f7f1; --danger: #ff6b6b; --danger-soft: #ffecec;
    --shadow: 0 10px 30px rgba(60, 40, 120, .12);
  }
  :root[data-theme="dark"] {
    --bg: #16132a; --bg-2: #101a2b; --card: #211d3a; --text: #f2eeff; --muted: #a49ec2;
    --line: #332c55; --primary: #9b8bff; --primary-soft: #2c2552; --accent: #2fd6ac;
    --accent-soft: #1c3f39; --danger: #ff8787; --danger-soft: #47262c;
    --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 880px; margin: 0 auto; padding: 14px 16px 40px; min-height: 100%; }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:focus-visible, input:focus-visible {
    outline: 3px solid var(--primary); outline-offset: 3px;
  }
  /* Quien tenga activado "reducir movimiento" no ve animaciones. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important; animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
  h1, h2, h3 { margin: 0; line-height: 1.15; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 4px 16px;
  }
  .topbar[hidden] { display: none; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
    background: var(--card); box-shadow: var(--shadow); font-size: 20px; flex: none;
  }
  .icon-btn:active { transform: scale(.94); }
  .who { display: flex; align-items: center; gap: 8px; font-weight: 800; }
  .who .av { font-size: 26px; }
  .spacer { flex: 1; }
  .stars-chip {
    display: flex; align-items: center; gap: 6px; font-weight: 800;
    background: var(--card); box-shadow: var(--shadow);
    padding: 9px 14px; border-radius: 999px; white-space: nowrap;
  }

  /* ---------- screens ---------- */
  .screen { display: none; animation: pop .25s ease both; }
  .screen.active { display: block; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .hero { text-align: center; padding: 22px 8px 26px; }
  .hero .logo { font-size: 52px; line-height: 1; }
  .hero h1 { font-size: clamp(28px, 7vw, 40px); margin-top: 10px; letter-spacing: -.5px; }
  .hero p { color: var(--muted); margin: 8px 0 0; font-weight: 600; }

  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px;
  }
  .section-title { font-size: 14px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 800; margin: 26px 4px 10px; }

  /* ---------- profiles ---------- */
  .profiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
  .profile {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 20px 12px; text-align: center; display: grid; gap: 6px; position: relative;
    border: 3px solid transparent; transition: transform .12s, border-color .12s;
  }
  .profile:hover { transform: translateY(-3px); border-color: var(--primary); }
  .profile .av { font-size: 44px; }
  .profile .nm { font-weight: 800; font-size: 17px; word-break: break-word; }
  .profile .sub { font-size: 13px; color: var(--muted); font-weight: 700; }
  .profile.add { border: 3px dashed var(--line); box-shadow: none; background: transparent; color: var(--muted); }
  .profile .del {
    position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; border-radius: 50%;
    font-size: 13px; color: var(--muted); opacity: .55;
  }
  .profile .del:hover { opacity: 1; color: var(--danger); background: var(--danger-soft); }

  .field { display: grid; gap: 8px; margin-bottom: 16px; }
  .field label { font-weight: 800; font-size: 14px; }
  input[type="text"] {
    font: inherit; font-weight: 700; padding: 14px 16px; border-radius: 16px;
    border: 2px solid var(--line); background: var(--bg); color: var(--text); width: 100%;
  }
  input[type="text"]:focus { outline: none; border-color: var(--primary); }
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .emoji-opt {
    width: 50px; height: 50px; border-radius: 14px; font-size: 26px; display: grid; place-items: center;
    background: var(--bg); border: 2px solid transparent;
  }
  .emoji-opt[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }

  .btn {
    display: block; width: 100%; padding: 16px 20px; border-radius: 18px; font-weight: 800;
    font-size: 17px; text-align: center; background: var(--primary); color: #fff;
    box-shadow: 0 8px 20px rgba(108, 92, 231, .32); transition: transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; box-shadow: none; cursor: not-allowed; }
  .btn.ghost { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
  .btn.accent { background: var(--accent); box-shadow: 0 8px 20px rgba(0, 184, 148, .3); }
  .btn-row { display: flex; gap: 12px; margin-top: 14px; }
  .btn-row .btn { flex: 1; }

  /* ---------- home ---------- */
  .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .mode {
    background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px;
    display: flex; gap: 12px; align-items: center; text-align: left; border: 3px solid transparent;
  }
  .mode[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
  .mode .ic { font-size: 26px; flex: none; }
  .mode .t { font-weight: 800; font-size: 15px; }
  .mode .d { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-top: 2px; }

  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 12px; }
  .cat {
    background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 8px;
    text-align: center; border: 3px solid transparent; display: grid; gap: 4px;
  }
  .cat[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); }
  .cat .ic { font-size: 30px; }
  .cat .t { font-weight: 800; font-size: 14px; }
  .bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 4px 10px 0; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }

  .sticky-play { position: sticky; bottom: 12px; margin-top: 22px; }

  /* ---------- game ---------- */
  .progress { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .progress .bar { flex: 1; height: 10px; margin: 0; }
  .progress .bar > i { background: var(--primary); }
  .progress .cnt { font-weight: 800; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .streak { font-weight: 800; font-size: 14px; }

  .prompt {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 26px 18px; text-align: center; margin-bottom: 18px;
  }
  .prompt .big { font-size: clamp(72px, 22vw, 110px); line-height: 1.05; }
  .prompt .word { font-size: clamp(30px, 9vw, 44px); font-weight: 900; letter-spacing: -.5px; }
  .prompt .hint { color: var(--muted); font-weight: 700; margin-top: 8px; font-size: 15px; }
  .prompt .ask { color: var(--muted); font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .speaker {
    width: 116px; height: 116px; border-radius: 50%; background: var(--primary); color: #fff;
    font-size: 48px; display: grid; place-items: center; margin: 0 auto;
    box-shadow: 0 10px 26px rgba(108, 92, 231, .4);
  }
  .speaker:active { transform: scale(.95); }
  .speaker.small { width: 54px; height: 54px; font-size: 24px; margin-top: 14px; box-shadow: 0 6px 16px rgba(108, 92, 231, .32); }
  .speaker.playing { animation: ring 1s ease infinite; }
  @keyframes ring { 0%,100% { box-shadow: 0 10px 26px rgba(108,92,231,.4); } 50% { box-shadow: 0 10px 26px rgba(108,92,231,.4), 0 0 0 16px rgba(108,92,231,.14); } }

  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .opt {
    background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
    padding: 20px 12px; font-weight: 800; font-size: 20px; text-align: center;
    border: 3px solid transparent; min-height: 74px; transition: transform .1s;
    display: grid; place-items: center; gap: 2px;
  }
  .opt .emo { font-size: 46px; line-height: 1.1; }
  .opt:active { transform: scale(.97); }
  .opt.correct { border-color: var(--accent); background: var(--accent-soft); }
  .opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
  .opt.dim { opacity: .4; }
  .opt:disabled { cursor: default; }

  /* spelling */
  .slots { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .slot {
    width: 46px; height: 56px; border-radius: 12px; background: var(--card); box-shadow: var(--shadow);
    display: grid; place-items: center; font-size: 24px; font-weight: 900; text-transform: uppercase;
    border: 3px solid transparent;
  }
  .slot.empty { background: transparent; box-shadow: none; border: 3px dashed var(--line); }
  .slot.correct { border-color: var(--accent); background: var(--accent-soft); }
  .slot.wrong { border-color: var(--danger); background: var(--danger-soft); }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .tile {
    width: 52px; height: 58px; border-radius: 14px; background: var(--primary); color: #fff;
    font-size: 24px; font-weight: 900; text-transform: uppercase;
    box-shadow: 0 6px 16px rgba(108, 92, 231, .3);
  }
  .tile:active { transform: scale(.94); }
  .tile.used { opacity: .18; pointer-events: none; }

  .feedback {
    margin-top: 16px; border-radius: 18px; padding: 14px 16px; font-weight: 800;
    display: flex; align-items: center; gap: 10px; min-height: 56px;
  }
  .feedback.ok { background: var(--accent-soft); color: var(--accent); }
  .feedback.no { background: var(--danger-soft); color: var(--danger); }
  .feedback .replay { margin-left: auto; font-size: 22px; }

  /* ---------- results ---------- */
  .result-hero { text-align: center; padding: 18px 10px 6px; }
  .result-hero .emo { font-size: 76px; }
  .result-hero h2 { font-size: 30px; margin: 8px 0 4px; }
  .result-hero p { color: var(--muted); font-weight: 700; margin: 0; }
  .score-row { display: flex; gap: 12px; margin: 20px 0 6px; }
  .score {
    flex: 1; background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
    padding: 16px 10px; text-align: center;
  }
  .score b { display: block; font-size: 26px; }
  .score span { font-size: 12.5px; color: var(--muted); font-weight: 700; }
  .review { display: grid; gap: 8px; }
  .review .r {
    display: flex; align-items: center; gap: 12px; background: var(--card);
    border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); font-weight: 700;
  }
  .review .r .e { font-size: 26px; }
  .review .r .en { font-weight: 900; }
  .review .r .es { color: var(--muted); margin-left: auto; font-size: 14px; }
  .badges { display: flex; flex-wrap: wrap; gap: 10px; }
  .badge {
    background: var(--card); box-shadow: var(--shadow); border-radius: 14px;
    padding: 10px 14px; font-weight: 800; font-size: 14px; display: flex; gap: 8px; align-items: center;
  }
  .badge.locked { opacity: .35; }

  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
  .confetti i {
    position: absolute; top: -40px; font-size: 22px; animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .2; } }

  .foot { text-align: center; color: var(--muted); font-size: 12.5px; font-weight: 600; margin-top: 28px; }

  @media (max-width: 380px) {
    .opt { font-size: 18px; padding: 16px 8px; }
    .tile { width: 46px; height: 52px; font-size: 21px; }
    .slot { width: 40px; height: 50px; font-size: 21px; }
  }
</style>
</head>
<body>
<div id="app">

  <div class="topbar" id="topbar" hidden>
    <button class="icon-btn" id="btn-back" aria-label="Volver">←</button>
    <div class="who"><span class="av" id="me-av">🦊</span><span id="me-name">—</span></div>
    <div class="spacer"></div>
    <div class="stars-chip">⭐ <span id="me-stars">0</span></div>
    <button class="icon-btn" id="btn-sound" aria-label="Sonido">🔊</button>
  </div>

  <!-- ============ PERFILES ============ -->
  <section class="screen active" id="screen-profiles">
    <div class="hero">
      <div class="logo">🎈🗣️🎉</div>
      <h1>Word Party</h1>
      <p>Aprende inglés jugando</p>
    </div>
    <div class="section-title">¿Quién juega?</div>
    <div class="profiles" id="profiles"></div>
  </section>

  <!-- ============ NUEVO PERFIL ============ -->
  <section class="screen" id="screen-new">
    <div class="hero"><div class="logo">✨</div><h1>Nuevo jugador</h1></div>
    <div class="card">
      <div class="field">
        <label for="new-name">Tu nombre</label>
        <input type="text" id="new-name" maxlength="14" placeholder="Escribe tu nombre" autocomplete="off">
      </div>
      <div class="field">
        <label>Elige tu personaje</label>
        <div class="emoji-grid" id="avatars"></div>
      </div>
      <button class="btn" id="btn-create" disabled>¡Empezar!</button>
      <div class="btn-row"><button class="btn ghost" id="btn-cancel-new">Cancelar</button></div>
    </div>
  </section>

  <!-- ============ HOME ============ -->
  <section class="screen" id="screen-home">
    <div class="hero" style="padding-bottom:10px">
      <div class="logo" id="home-av">🦊</div>
      <h1 id="home-greet">¡Hola!</h1>
      <p id="home-sub">Elige un juego y un tema</p>
    </div>

    <div class="section-title">Juego</div>
    <div class="modes" id="modes"></div>

    <div class="section-title">Tema</div>
    <div class="cats" id="cats"></div>

    <div class="sticky-play">
      <button class="btn accent" id="btn-play">▶︎ ¡Jugar!</button>
    </div>

    <div class="section-title">Medallas</div>
    <div class="badges" id="badges"></div>

    <div class="foot">Hecho con cariño para aprender inglés en casa 💜</div>
  </section>

  <!-- ============ JUEGO ============ -->
  <section class="screen" id="screen-game">
    <div class="progress">
      <div class="bar"><i id="game-bar" style="width:0%"></i></div>
      <div class="cnt" id="game-cnt">1 / 10</div>
      <div class="streak" id="game-streak"></div>
    </div>
    <div class="prompt" id="prompt"></div>
    <div id="answer-area"></div>
    <div class="feedback" id="feedback" style="visibility:hidden">&nbsp;</div>
  </section>

  <!-- ============ RESULTADOS ============ -->
  <section class="screen" id="screen-results">
    <div class="result-hero">
      <div class="emo" id="res-emo">🏆</div>
      <h2 id="res-title">¡Muy bien!</h2>
      <p id="res-sub"></p>
    </div>
    <div class="score-row">
      <div class="score"><b id="res-correct">0</b><span>aciertos</span></div>
      <div class="score"><b id="res-stars">0</b><span>estrellas</span></div>
      <div class="score"><b id="res-best">0</b><span>racha</span></div>
    </div>
    <div id="res-review-wrap" hidden>
      <div class="section-title">Para repasar</div>
      <div class="review" id="res-review"></div>
    </div>
    <div id="res-new-badges"></div>
    <div class="btn-row">
      <button class="btn accent" id="btn-again">Otra vez</button>
      <button class="btn ghost" id="btn-menu">Menú</button>
    </div>
  </section>

</div>

<script>
(function () {
  'use strict';

  /* =======================================================================
     1. DATOS: vocabulario por temas
     Para añadir palabras solo hay que meter { en, es, emoji } en un tema.
     ======================================================================= */
  const CATEGORIES = [

      { en: 'bird', es: 'pájaro', emoji: '🐦' }, { en: 'fish', es: 'pez', emoji: '🐟' },

    ]},
    { id: 'colors', name: 'Colores', icon: '🎨', words: [

      { en: 'green', es: 'verde', emoji: '🟩' }, { en: 'yellow', es: 'amarillo', emoji: '🟨' },
      { en: 'orange', es: 'naranja', emoji: '🟧' }, { en: 'purple', es: 'morado', emoji: '🟪' },

    { id: 'food', name: 'Comida', icon: '🍎', words: [

      { en: 'bread', es: 'pan', emoji: '🍞' }, { en: 'milk', es: 'leche', emoji: '🥛' },
      { en: 'cheese', es: 'queso', emoji: '🧀' }, { en: 'egg', es: 'huevo', emoji: '🥚' },
      { en: 'water', es: 'agua', emoji: '💧' }, { en: 'grapes', es: 'uvas', emoji: '🍇' },

  function catWords(catId) {
    if (catId === 'all') return ALL_WORDS;

  /* =======================================================================

  const $ = sel => document.querySelector(sel);
  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };
  const rnd = n => Math.floor(Math.random() * n);
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ---- sonido ---- */
  let actx = null;
  function beep(kind) {
    if (!data.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const notes = kind === 'ok' ? [660, 880, 1180] : [300, 220];
      notes.forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'sine'; o.frequency.value = f;
        const t = actx.currentTime + i * 0.09;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t + 0.24);
      });
    } catch (e) {}
  }

  let enVoice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices();
    enVoice = vs.find(v => /^en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }
  function say(text, onEnd) {
    if (!('speechSynthesis' in window)) { if (onEnd) onEnd(); return; }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = enVoice ? enVoice.lang : 'en-US';
      if (enVoice) u.voice = enVoice;
      u.rate = 0.82; u.pitch = 1.1;
      if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
      speechSynthesis.speak(u);
    } catch (e) { if (onEnd) onEnd(); }
  }

  /* =======================================================================
     7. MOTOR DEL JUEGO
     ======================================================================= */
  // Elige palabras dando más peso a las que aún no domina (repaso espaciado sencillo).
  function chooseWords(pool, n) {
    const weighted = [];
    pool.forEach(w => {
      const m = me.mastery[w.en] || 0;
      const weight = m <= 0 ? 5 : m === 1 ? 4 : m === 2 ? 3 : m === 3 ? 2 : 1;
      for (let i = 0; i < weight; i++) weighted.push(w);
    });
    const out = [];
    const seen = {};
    let guard = 0;
    while (out.length < Math.min(n, pool.length) && guard++ < 4000) {
      const w = weighted[rnd(weighted.length)];
      if (!seen[w.en]) { seen[w.en] = 1; out.push(w); }
    }
    return out;
  }

  // Distractores del mismo tema, nunca con el mismo dibujo que la respuesta
  // (si no, en el modo "escucha" habría dos opciones válidas).
  function distractors(word, pool, n) {
    const usable = w => w.en !== word.en && w.emoji !== word.emoji;
    let same = pool.filter(usable);
    if (same.length < n) same = ALL_WORDS.filter(usable);
    const out = [], usedEmoji = {};
    usedEmoji[word.emoji] = 1;
    shuffle(same).forEach(w => {
      if (out.length < n && !usedEmoji[w.emoji]) { usedEmoji[w.emoji] = 1; out.push(w); }
    });
    return out;
  }

  function startGame() {
    let pool = catWords(pick.cat);
    // El modo "escribe" solo usa palabras cortas de una sola pieza.
    if (pick.mode === 'spell') {
      const short = pool.filter(w => w.en.length <= 7 && !/\s/.test(w.en));
      pool = short.length >= 6 ? short : ALL_WORDS.filter(w => w.en.length <= 7 && !/\s/.test(w.en));
    }
    game = {
      mode: pick.mode,
      cat: pick.cat,
      pool: pool,
      queue: chooseWords(pool, ROUND_LENGTH),
      i: 0, correct: 0, stars: 0, streak: 0, best: 0,
      missed: [], locked: false, cleanup: null
    };
    const round = game;
    game.isCurrent = () => game === round;
    show('screen-game');
    nextQuestion();
  }

  function nextQuestion() {
    if (!game) return;
    if (game.cleanup) { game.cleanup(); game.cleanup = null; }
    if (game.i >= game.queue.length) return finishGame();
    game.locked = false;
    const w = game.queue[game.i];

    $('#game-bar').style.width = (game.i / game.queue.length * 100) + '%';
    $('#game-cnt').textContent = (game.i + 1) + ' / ' + game.queue.length;
    $('#game-streak').textContent = game.streak >= 3 ? '🔥 ' + game.streak : '';
    const fb = $('#feedback');
    fb.style.visibility = 'hidden'; fb.className = 'feedback'; fb.innerHTML = '&nbsp;';

    const prompt = $('#prompt');
    const area = $('#answer-area');
    prompt.innerHTML = ''; area.innerHTML = '';

    if (game.mode === 'look')      renderLook(w, prompt, area);
    else if (game.mode === 'listen')    renderListen(w, prompt, area);
    else if (game.mode === 'translate') renderTranslate(w, prompt, area);
    else                                renderSpell(w, prompt, area);
  }

  function optionButton(html, onClick) {
    const b = el('button', 'opt', html);
    b.addEventListener('click', () => onClick(b));
    return b;
  }

  function renderLook(w, prompt, area) {
    prompt.innerHTML = '<div class="ask">¿Cómo se dice en inglés?</div><div class="big">' + w.emoji + '</div>';
    const opts = shuffle(distractors(w, game.pool, 3).concat([w]));
    const box = el('div', 'options');
    opts.forEach(o => box.appendChild(optionButton(escapeHtml(o.en), b => answer(o.en === w.en, w, b, box))));
    area.appendChild(box);
  }

  function renderTranslate(w, prompt, area) {
    prompt.innerHTML = '<div class="ask">En inglés, «' + escapeHtml(w.es) + '» es…</div>' +
                       '<div class="word">' + escapeHtml(w.es) + '</div>';
    const opts = shuffle(distractors(w, game.pool, 3).concat([w]));
    const box = el('div', 'options');
    opts.forEach(o => box.appendChild(optionButton(escapeHtml(o.en), b => answer(o.en === w.en, w, b, box))));
    area.appendChild(box);
  }

  function renderListen(w, prompt, area) {
    prompt.innerHTML = '<div class="ask">Escucha y toca el dibujo</div>';
    const sp = el('button', 'speaker', '🔊');
    sp.setAttribute('aria-label', 'Repetir la palabra');
    const play = () => {
      sp.classList.add('playing');
      say(w.en, () => sp.classList.remove('playing'));
      setTimeout(() => sp.classList.remove('playing'), 2500);
    };
    sp.addEventListener('click', play);
    prompt.appendChild(sp);
    setTimeout(play, 350);

    const opts = shuffle(distractors(w, game.pool, 3).concat([w]));
    const box = el('div', 'options');
    opts.forEach(o => box.appendChild(optionButton('<span class="emo">' + o.emoji + '</span>',
      b => answer(o.en === w.en, w, b, box))));
    area.appendChild(box);
  }

  function renderSpell(w, prompt, area) {
    prompt.innerHTML = '<div class="big">' + w.emoji + '</div><div class="hint">' + escapeHtml(w.es) + '</div>';
    const hear = el('button', 'speaker small', '🔊');
    hear.setAttribute('aria-label', 'Escuchar la palabra');
    hear.addEventListener('click', () => say(w.en));
    prompt.appendChild(hear);

    const letters = w.en.split('');
    const slotsBox = el('div', 'slots');
    const tilesBox = el('div', 'tiles');
    const filled = [];

    letters.forEach(() => {
      const s = el('div', 'slot empty', '');
      slotsBox.appendChild(s);
    });

    const bag = shuffle(letters.map((ch, i) => ({ ch: ch, i: i })));
    bag.forEach(t => {
      const b = el('button', 'tile', t.ch);
      b.addEventListener('click', () => useTile(b, t.ch));
      tilesBox.appendChild(b);
    });

    function useTile(b, ch) {
      if (game.locked || filled.length >= letters.length || b.classList.contains('used')) return;
      b.classList.add('used');
      filled.push({ ch: ch, tile: b });
      paint();
      if (filled.length === letters.length) setTimeout(check, 220);
    }

    function undo() {
      if (game.locked || !filled.length) return;
      const removed = filled.pop();
      removed.tile.classList.remove('used');
      paint();
    }

    // Con teclado también se puede escribir (útil en portátil).
    function onKey(ev) {
      if (game.locked) return;
      if (ev.key === 'Backspace') { ev.preventDefault(); undo(); return; }
      const k = ev.key.length === 1 ? ev.key.toLowerCase() : '';
      if (!k) return;
      const free = Array.prototype.filter.call(tilesBox.children, b => !b.classList.contains('used'));
      const hit = free.find(b => b.textContent === k);
      if (hit) { ev.preventDefault(); useTile(hit, k); }
    }
    document.addEventListener('keydown', onKey);
    game.cleanup = () => document.removeEventListener('keydown', onKey);

    function paint() {
      const slots = slotsBox.children;
      for (let i = 0; i < slots.length; i++) {
        const s = slots[i];
        if (filled[i]) { s.textContent = filled[i].ch; s.className = 'slot'; }
        else { s.textContent = ''; s.className = 'slot empty'; }
      }
    }
    // Tocar un hueco lleno devuelve la letra.
    slotsBox.addEventListener('click', ev => {
      if (game.locked) return;
      const idx = Array.prototype.indexOf.call(slotsBox.children, ev.target);
      if (idx < 0 || !filled[idx]) return;
      const removed = filled.splice(idx, 1)[0];
      removed.tile.classList.remove('used');
      paint();
    });

    function check() {
      const guess = filled.map(f => f.ch).join('');
      const ok = guess === w.en;
      Array.prototype.forEach.call(slotsBox.children, s => s.classList.add(ok ? 'correct' : 'wrong'));
      if (!ok) {
        setTimeout(() => {
          Array.prototype.forEach.call(slotsBox.children, (s, i) => {
            s.textContent = letters[i]; s.className = 'slot correct';
          });
        }, 700);
      }
      answer(ok, w, null, tilesBox);
    }

    area.appendChild(slotsBox);
    area.appendChild(tilesBox);
  }

  function answer(ok, word, btn, container) {
    if (game.locked) return;
    game.locked = true;

    // marca visual de las opciones
    if (container && container.classList.contains('options')) {
      Array.prototype.forEach.call(container.children, b => {
        b.disabled = true;
        const text = b.textContent.trim();
        const isRight = (game.mode === 'listen') ? text === word.emoji : text === word.en;
        if (isRight) b.classList.add('correct');
        else if (b === btn) b.classList.add('wrong');
        else b.classList.add('dim');
      });
    } else if (container) {
      Array.prototype.forEach.call(container.children, b => { b.disabled = true; });
    }

    const m = me.mastery[word.en] || 0;
    if (ok) {
      game.correct++;
      game.streak++;
      game.best = Math.max(game.best, game.streak);
      const bonus = game.streak >= 5 ? 2 : game.streak >= 3 ? 1 : 0;
      game.stars += 1 + bonus;
      me.mastery[word.en] = Math.min(5, m + 1);
      beep('ok');
      const fb = $('#feedback');
      fb.className = 'feedback ok';
      fb.innerHTML = '<span>✅ ' + PRAISE_OK[rnd(PRAISE_OK.length)] + ' <b>' + escapeHtml(word.en) + '</b>' +
                     (bonus ? ' · +' + (1 + bonus) + '⭐' : '') + '</span>';
      fb.style.visibility = 'visible';
      addReplay(fb, word);
    } else {
      game.streak = 0;
      me.mastery[word.en] = Math.max(-1, m - 1);
      if (!game.missed.some(x => x.en === word.en)) game.missed.push(word);
      beep('no');
      const fb = $('#feedback');
      fb.className = 'feedback no';
      fb.innerHTML = '<span>💡 Es <b>' + escapeHtml(word.en) + '</b> — ' + escapeHtml(word.es) + '</span>';
      fb.style.visibility = 'visible';
      addReplay(fb, word);
    }

    $('#game-streak').textContent = game.streak >= 3 ? '🔥 ' + game.streak : '';
    say(word.en);
    save();

    const round = game;
    setTimeout(() => {
      if (!game || !round.isCurrent()) return;  // el jugador salió o empezó otra partida
      game.i++;
      nextQuestion();
    }, ok ? 1300 : 2300);
  }

  function addReplay(fb, word) {
    const r = el('button', 'replay', '🔊');
    r.setAttribute('aria-label', 'Escuchar otra vez');
    r.addEventListener('click', ev => { ev.stopPropagation(); say(word.en); });
    fb.appendChild(r);
  }

  /* =======================================================================
     8. RESULTADOS
     ======================================================================= */
  function finishGame() {
    if (game.cleanup) { game.cleanup(); game.cleanup = null; }
    const before = me.stars;
    me.stars += game.stars;
    me.plays = (me.plays || 0) + 1;
    save();

    const pct = game.correct / game.queue.length;
    $('#res-emo').textContent = pct === 1 ? '🏆' : pct >= 0.7 ? '🎉' : pct >= 0.4 ? '💪' : '🌱';
    $('#res-title').textContent = pct === 1 ? '¡Perfecto!' : pct >= 0.7 ? '¡Muy bien!' : pct >= 0.4 ? '¡Buen intento!' : '¡A seguir!';
    $('#res-sub').textContent = pct === 1
      ? 'Todas correctas, ' + me.name + ' 🤩'
      : 'Has acertado ' + game.correct + ' de ' + game.queue.length;
    $('#res-correct').textContent = game.correct + '/' + game.queue.length;
    $('#res-stars').textContent = '+' + game.stars;
    $('#res-best').textContent = game.best;

    const wrap = $('#res-review-wrap');
    const rev = $('#res-review');
    rev.innerHTML = '';
    if (game.missed.length) {
      wrap.hidden = false;
      game.missed.forEach(w => {
        const r = el('div', 'r');
        r.innerHTML = '<span class="e">' + w.emoji + '</span><span class="en">' + escapeHtml(w.en) + '</span>' +
                      '<span class="es">' + escapeHtml(w.es) + '</span>';
        const b = el('button', 'replay', '🔊');
        b.setAttribute('aria-label', 'Escuchar ' + w.en);
        b.addEventListener('click', () => say(w.en));
        r.appendChild(b);
        rev.appendChild(r);
      });
    } else {
      wrap.hidden = true;
    }

    const newBadges = BADGES.filter(b => before < b.stars && me.stars >= b.stars);
    const nb = $('#res-new-badges');
    nb.innerHTML = '';
    if (newBadges.length) {
      nb.appendChild(el('div', 'section-title', '¡Medalla nueva!'));
      const box = el('div', 'badges');
      newBadges.forEach(b => box.appendChild(el('div', 'badge', '<span>' + b.icon + '</span><span>' + b.name + '</span>')));
      nb.appendChild(box);
    }

    syncTopbar();
    show('screen-results');
    if (pct >= 0.7 || newBadges.length) { confetti(); beep('ok'); }
  }

  $('#btn-again').addEventListener('click', () => startGame());
  $('#btn-menu').addEventListener('click', () => { game = null; renderHome(); show('screen-home'); });

  /* =======================================================================
     9. ARRANQUE
     ======================================================================= */
  load();
  renderProfiles();
  if (data.profiles.length === 0) {
    show('screen-profiles');
  } else if (data.lastProfileId && data.profiles.some(p => p.id === data.lastProfileId)) {
    enter(data.lastProfileId);
  } else {
    show('screen-profiles');
  }
})();
</script>
