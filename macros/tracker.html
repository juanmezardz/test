<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macro Tracker</title>
<meta name="description" content="Personal calorie and macro tracker — calorie ring, macros, water, and a food diary.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0F" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/webp" href="icon-192.webp" sizes="192x192">
<link rel="icon" type="image/png" href="apple-touch-icon.png" sizes="180x180">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Macros">
<style>
  :root{
    --accent:#2563EB; --accent2:#4F8BFF;
    --protein:#2563EB; --carbs:#14B8A6; --fat:#F59E0B; --water:#38BDF8;
    --bg:#FFFFFF; --card:#FFFFFF; --card2:#F8FAFC; --ink:#0B1220; --muted:#64748B;
    --line:#E9EDF5; --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 20px rgba(15,23,42,.06);
    --page:linear-gradient(160deg,#E7EEFF 0%,#F5F7FB 45%,#EAF1FF 100%);
    --bezel:#1B1D22; --frame-shadow:0 30px 70px rgba(15,23,42,.35);
  }
  html[data-theme="dark"]{
    --bg:#0B0B0F; --card:#1A1A1F; --card2:#141419; --ink:#F5F7FA; --muted:#9AA3B2;
    --line:#26262E; --shadow:0 1px 2px rgba(0,0,0,.6),0 10px 26px rgba(0,0,0,.45);
    --page:linear-gradient(160deg,#0D1220 0%,#08080C 50%,#0C1122 100%);
    --bezel:#0A0A0C; --frame-shadow:0 30px 70px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--page); color:var(--ink); min-height:100vh;
    display:flex; align-items:flex-start; justify-content:center; padding:34px 12px;
    transition:background .3s ease,color .3s ease;
  }

  /* ---------- phone frame ---------- */
  .device{width:400px;max-width:100%;background:var(--bezel);border-radius:52px;padding:11px;
    box-shadow:var(--frame-shadow),inset 0 0 0 1.5px rgba(255,255,255,.09)}
  .glass{background:var(--bg);border-radius:42px;overflow:hidden;position:relative;transition:background .3s ease}
  .statusbar{display:flex;align-items:center;justify-content:space-between;padding:11px 24px 4px;
    font-size:13px;font-weight:600;letter-spacing:.01em;position:relative;z-index:2}
  .island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:29px;
    background:var(--bezel);border-radius:20px;z-index:3}
  html[data-theme="light"] .statusbar,html:not([data-theme="dark"]) .statusbar{color:#0B1220}
  .batt{display:flex;align-items:center;gap:5px}
  .batt .shell{width:23px;height:11.5px;border:1.4px solid currentColor;border-radius:3.5px;position:relative;opacity:.9}
  .batt .shell::after{content:"";position:absolute;right:-3.5px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0;opacity:.6}
  .batt .fill{position:absolute;left:1.2px;top:1.2px;bottom:1.2px;width:68%;background:currentColor;border-radius:2px}
  .app{padding:6px 18px 22px;max-height:78vh;overflow-y:auto;scrollbar-width:thin}
  .app::-webkit-scrollbar{width:0}

  /* ---------- header ---------- */
  header{display:flex;align-items:flex-start;justify-content:space-between;margin:8px 0 14px}
  h1{font-size:31px;font-weight:800;letter-spacing:-.025em;margin:0;line-height:1.05}
  .date{font-size:13.5px;color:var(--muted);margin-top:3px;font-weight:500}
  .iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card2);
    color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
  .iconbtn:hover{border-color:var(--accent);color:var(--accent)}
  .seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px;margin-bottom:16px}
  .seg button{flex:1;font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--muted);
    padding:8px 4px;border-radius:11px;cursor:pointer;transition:all .18s}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.16)}
  html[data-theme="dark"] .seg button.on{background:#2A2A33}

  /* ---------- cards ---------- */
  .card{background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);
    border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
  .card h3{margin:0 0 14px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

  /* ---------- hero ring ---------- */
  .hero{display:flex;flex-direction:column;align-items:center;padding:24px 18px 20px}
  .ringwrap{position:relative;width:200px;height:200px;filter:drop-shadow(0 6px 18px rgba(37,99,235,.28))}
  .ringwrap svg{transform:rotate(-90deg)}
  .ringtext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .kcal{font-size:47px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
  .kcal-sub{font-size:12.5px;color:var(--muted);font-weight:500}
  .kcal-left{font-size:13px;font-weight:700;color:var(--accent);margin-top:2px}
  .over{color:var(--fat)!important}

  /* ---------- macro rings ---------- */
  .macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .macro{display:flex;flex-direction:column;align-items:center;gap:7px}
  .macro .mw{position:relative;width:78px;height:78px}
  .macro .mw svg{transform:rotate(-90deg)}
  .macro .mv{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .macro .ml{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em}
  .macro .mt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:-4px}

  /* ---------- water ---------- */
  .waterrow{display:flex;align-items:center;gap:12px}
  .waterrow .amt{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;min-width:88px}
  .waterrow .amt small{display:block;font-size:11px;color:var(--muted);font-weight:500}
  .wbar{flex:1;height:9px;border-radius:99px;background:var(--card2);border:1px solid var(--line);overflow:hidden}
  .wbar > div{height:100%;border-radius:99px;background:linear-gradient(90deg,#38BDF8,#0EA5E9);transition:width .45s cubic-bezier(.4,0,.2,1)}
  .pm{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--card2);
    color:var(--ink);font-size:19px;font-weight:600;line-height:1;cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center}
  .pm:hover{border-color:var(--water);color:var(--water)}

  /* ---------- chart ---------- */
  .chart{position:relative}
  .track{display:flex;align-items:flex-end;gap:7px;height:96px}
  .bar{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
  .bar .col{width:100%;max-width:26px;border-radius:7px 7px 4px 4px;background:linear-gradient(180deg,var(--accent2),var(--accent));
    transition:height .5s cubic-bezier(.4,0,.2,1);min-height:3px}
  .bar.overt .col{background:linear-gradient(180deg,#FBBF24,var(--fat))}
  .bar.empty .col{background:var(--line)}
  .bar.sel .col{outline:2px solid var(--accent);outline-offset:2px}
  .days{display:flex;gap:7px;margin-top:8px}
  .days span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);font-weight:600}
  .tline{position:absolute;left:0;right:0;border-top:1px dashed var(--line);pointer-events:none}
  .tline span{position:absolute;right:0;top:-14px;font-size:9.5px;color:var(--muted);background:var(--card);padding:0 3px}

  /* ---------- diary ---------- */
  .meal{margin-bottom:14px}
  .meal:last-child{margin-bottom:0}
  .mhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .mhead .dot{width:7px;height:7px;border-radius:99px}
  .mhead .nm{font-size:13.5px;font-weight:700;letter-spacing:.01em}
  .mhead .cal{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
  .item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
    border-radius:14px;background:var(--card2);margin-bottom:7px;transition:all .18s}
  .item:hover{border-color:#C7D6F5}
  .item .txt{flex:1;min-width:0}
  .item .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .m{font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .item .c{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .x{width:22px;height:22px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);
    font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;flex:0 0 auto}
  .x:hover{border-color:#EF4444;color:#EF4444}
  .empty-msg{font-size:13px;color:var(--muted);text-align:center;padding:14px 0}

  /* ---------- log food ---------- */
  .logcard textarea{width:100%;font:inherit;font-size:15px;padding:13px 14px;border:1px solid var(--line);
    border-radius:15px;background:var(--bg);color:var(--ink);outline:none;resize:vertical;min-height:74px;
    transition:border-color .15s,box-shadow .15s}
  .logcard textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
  .logrow{display:flex;gap:8px;margin-top:10px;align-items:center}
  .logrow .go{flex:1;font:inherit;font-size:15px;font-weight:600;padding:12px;border-radius:13px;border:0;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 5px 14px rgba(37,99,235,.3);
    display:flex;align-items:center;justify-content:center;gap:8px}
  .logrow .go[disabled]{opacity:.6;cursor:default}
  .photo{width:46px;height:46px;flex:0 0 auto;border-radius:13px;border:1px solid var(--line);background:var(--card2);
    color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;padding:0;overflow:hidden}
  .photo:hover{border-color:var(--accent);color:var(--accent)}
  .photo img{width:100%;height:100%;object-fit:cover}
  .photo.has{border-color:var(--accent)}
  .spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:99px;
    animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
  .aimsg{font-size:12px;line-height:1.5;margin:10px 0 0;padding:9px 11px;border-radius:11px;
    background:var(--card2);border:1px solid var(--line);color:var(--muted)}
  .aimsg.bad{border-color:#EF4444;color:#EF4444}
  .aimsg b{color:var(--ink);font-weight:600}
  .manual{width:100%;font:inherit;font-size:13px;font-weight:600;padding:10px;border-radius:12px;border:1px dashed var(--line);
    background:transparent;color:var(--muted);cursor:pointer;transition:all .18s;margin-top:10px}
  .manual:hover{border-color:var(--accent);color:var(--accent)}
  .form{display:none;flex-direction:column;gap:9px;margin-top:10px}
  .form.on{display:flex}
  .form input,.form select{width:100%;font:inherit;font-size:14px;padding:11px 12px;border:1px solid var(--line);
    border-radius:12px;background:var(--bg);color:var(--ink);outline:none}
  .form input:focus,.form select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.14)}
  .form .r{display:flex;gap:8px}
  .form .r > *{flex:1;min-width:0}
  .save{font:inherit;font-size:15px;font-weight:600;padding:12px;border-radius:13px;border:0;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 5px 14px rgba(37,99,235,.3)}

  /* ---------- backup ---------- */
  .exp{width:100%;display:flex;align-items:center;gap:9px;font:inherit;font-size:13.5px;font-weight:600;color:var(--ink);
    background:transparent;border:0;padding:2px 0;cursor:pointer}
  .exp .chev{margin-left:auto;color:var(--muted);transition:transform .25s}
  .exp.on .chev{transform:rotate(90deg)}
  .panel{display:none;padding-top:14px}
  .panel.on{display:block}
  .panel textarea{width:100%;font:inherit;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);
    min-height:70px;resize:vertical;outline:none;word-break:break-all}
  .panel .btns{display:flex;gap:8px;margin-top:9px}
  .panel .btns button{flex:1;font:inherit;font-size:13.5px;font-weight:600;padding:11px;border-radius:12px;
    border:1px solid var(--line);background:var(--card2);color:var(--ink);cursor:pointer;transition:all .18s}
  .panel .btns button:hover{border-color:var(--accent);color:var(--accent)}
  .hint{font-size:11.5px;color:var(--muted);margin:9px 0 0;line-height:1.5}

  /* ---------- install prompt ---------- */
  .install{display:flex;align-items:center;gap:12px}
  .install .ic{width:38px;height:38px;border-radius:11px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff}
  .install .tx{flex:1;min-width:0}
  .install .tx b{display:block;font-size:14px}
  .install .tx span{font-size:11.5px;color:var(--muted);line-height:1.45;display:block;margin-top:2px}
  .install button{font:inherit;font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:11px;border:0;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;flex:0 0 auto}
  .install .no{background:none;color:var(--muted);padding:9px 4px;font-weight:500}

  /* ---------- installed (standalone) ---------- */
  html.app-mode body{padding:0;align-items:stretch;background:var(--bg)}
  html.app-mode .device{width:100%;max-width:none;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
  html.app-mode .glass{border-radius:0;min-height:100vh}
  html.app-mode .island,html.app-mode .statusbar{display:none}
  html.app-mode .app{max-height:none;overflow:visible;max-width:480px;margin:0 auto;
    padding-top:calc(env(safe-area-inset-top,0px) + 14px);
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}

  footer{text-align:center;font-size:10.5px;color:var(--muted);line-height:1.5;padding:4px 6px 2px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#0F172A;color:#fff;
    font-size:13px;font-weight:600;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;
    transition:all .28s cubic-bezier(.4,0,.2,1);z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="device">
  <div class="glass">
    <div class="island"></div>
    <div class="statusbar">
      <span id="clock">9:41</span>
      <span class="batt"><span id="battpct" style="font-size:11.5px;opacity:.75"></span>
        <span class="shell"><span class="fill" id="battfill"></span></span></span>
    </div>
    <div class="app" id="app"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ==================================================================== *
 *  EMBEDDED DATA — the coach rewrites this block on every log.
 *  It is authoritative: whenever it changes, the tracker reloads from it.
 *  localStorage only carries the latest state across a manual refresh.
 * ==================================================================== */
var EMBEDDED = {
  plan: {
    name: "",
    goal: "lose",              // lose | maintain | gain
    calories: 2100,
    protein: 165,              // grams
    carbs: 205,                // grams
    fat: 65,                   // grams
    waterL: 3.0,               // liters
    calculated: ""             // e.g. "July 30, 2026"
  },
  // One entry per food item. date is YYYY-MM-DD, meal is breakfast|lunch|dinner|snacks.
  log: [
    // {id:"1", date:"2026-07-30", meal:"breakfast", name:"Scrambled eggs", serving:"3 large", cal:215, p:19, c:2, f:15}
  ],
  // Glasses of water (250 ml each) per day.
  water: {
    // "2026-07-30": 6
  }
};
/* ==================== END EMBEDDED DATA ============================= */

var GLASS_L = 0.25;
var MEALS = [
  {k:'breakfast', l:'Breakfast', c:'#F59E0B'},
  {k:'lunch',     l:'Lunch',     c:'#2563EB'},
  {k:'dinner',    l:'Dinner',    c:'#8B5CF6'},
  {k:'snacks',    l:'Snacks',    c:'#14B8A6'}
];
var KEY = 'macrotracker.state.v1', SIGKEY = 'macrotracker.sig.v1', THEMEKEY = 'macrotracker.theme';

/* ---------------- dates ---------------- */
function iso(d){ var p=function(x){return (x<10?'0':'')+x;}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function parseISO(s){ var a=s.split('-'); return new Date(+a[0], +a[1]-1, +a[2]); }
function addDays(s,n){ var d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); }
function todayISO(){ return iso(new Date()); }
function prettyDate(s){
  return parseISO(s).toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
}
function dayTitle(s){
  var t = todayISO();
  if (s === t) return 'Today';
  if (s === addDays(t,-1)) return 'Yesterday';
  if (s === addDays(t,1)) return 'Tomorrow';
  return parseISO(s).toLocaleDateString(undefined,{weekday:'long'});
}

/* ---------------- state ---------------- */
var state, selected = todayISO(), lastKcal = 0, lastDateSeen = todayISO(), lastTheme = null;

function signature(){ return JSON.stringify(EMBEDDED); }

function freshFromEmbedded(){
  return {
    plan:  JSON.parse(JSON.stringify(EMBEDDED.plan)),
    log:   JSON.parse(JSON.stringify(EMBEDDED.log || [])).map(function(e,i){
             if (!e.id) e.id = 'e' + i + '_' + Math.random().toString(36).slice(2,7);
             return e;
           }),
    water: JSON.parse(JSON.stringify(EMBEDDED.water || {}))
  };
}

function load(){
  var sig = signature();
  var storedSig, stored;
  try { storedSig = localStorage.getItem(SIGKEY); stored = localStorage.getItem(KEY); } catch(e){}
  if (stored && storedSig === sig) {
    try {
      var s = JSON.parse(stored);
      if (s && s.plan && s.log) return s;
    } catch(e){}
  }
  var fresh = freshFromEmbedded();
  try { localStorage.setItem(SIGKEY, sig); localStorage.setItem(KEY, JSON.stringify(fresh)); } catch(e){}
  return fresh;
}

function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem(SIGKEY, signature()); } catch(e){}
}

/* ---------------- derived ---------------- */
function itemsFor(date){ return state.log.filter(function(e){ return e.date === date; }); }
function totals(date){
  return itemsFor(date).reduce(function(t,e){
    t.cal += +e.cal||0; t.p += +e.p||0; t.c += +e.c||0; t.f += +e.f||0; return t;
  }, {cal:0,p:0,c:0,f:0});
}
function glasses(date){ return state.water[date] || 0; }

/* ---------------- helpers ---------------- */
function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function ring(size, stroke, pct, color, glow){
  var r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.min(pct,1));
  var id = 'g' + Math.random().toString(36).slice(2,8);
  var isGrad = color === 'accent';
  return '<svg width="'+size+'" height="'+size+'">' +
    (isGrad ? '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#4F8BFF"/></linearGradient></defs>' : '') +
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="'+stroke+'"/>' +
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(isGrad?'url(#'+id+')':color)+'" ' +
      'stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" ' +
      'stroke-dashoffset="'+off.toFixed(2)+'" style="transition:stroke-dashoffset .7s cubic-bezier(.4,0,.2,1)"' +
      (glow?' filter="drop-shadow(0 0 6px rgba(37,99,235,.5))"':'') + '/>' +
  '</svg>';
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('on'); }, 1900);
}

/* ---------------- theme ---------------- */
function initTheme(){
  var saved;
  try { saved = localStorage.getItem(THEMEKEY); } catch(e){}
  var dark = saved ? saved === 'dark'
    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}
function toggleTheme(){
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  try { localStorage.setItem(THEMEKEY, dark ? 'light' : 'dark'); } catch(e){}
  render();
}

/* ---------------- status bar ---------------- */
function tickStatus(){
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  var hh = h % 12 === 0 ? 12 : h % 12;
  document.getElementById('clock').textContent = hh + ':' + (m<10?'0':'') + m;
  if (navigator.getBattery) {
    navigator.getBattery().then(function(b){
      document.getElementById('battfill').style.width = Math.round(b.level*100) + '%';
      document.getElementById('battpct').textContent = Math.round(b.level*100) + '%';
    }).catch(function(){});
  }
  // roll over to a new day automatically
  if (todayISO() !== lastDateSeen) {
    var wasToday = selected === lastDateSeen;
    lastDateSeen = todayISO();
    if (wasToday) selected = lastDateSeen;
    render();
  }
}

function mealIcon(k){
  var s = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  if (k === 'breakfast') return s + '<path d="M3 17h18M5 17a7 7 0 0114 0"/><path d="M12 3v2M5.5 6.5l1.4 1.4M18.5 6.5l-1.4 1.4"/></svg>';
  if (k === 'lunch')     return s + '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4"/></svg>';
  if (k === 'dinner')    return s + '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
  return s + '<path d="M7 11a5 5 0 0110 0c0 5-2.5 9-5 9s-5-4-5-9z"/><path d="M12 6V3l2.5-1"/></svg>';
}

function countUp(node, from, to){
  var start = performance.now(), dur = 550, delta = to - from;
  if (!delta) { node.textContent = to.toLocaleString(); return; }
  (function frame(now){
    var t = Math.min((now - start) / dur, 1);
    var e = 1 - Math.pow(1 - t, 3);
    node.textContent = Math.round(from + delta * e).toLocaleString();
    if (t < 1) requestAnimationFrame(frame);
  })(start);
}

/* ---------------- save code ---------------- */
function encodeState(){
  var json = JSON.stringify({v:1, plan:state.plan, log:state.log, water:state.water});
  return btoa(unescape(encodeURIComponent(json)));
}
function decodeState(code){
  try {
    var s = JSON.parse(decodeURIComponent(escape(atob(code.replace(/\s+/g,'')))));
    if (!s || !s.plan || !Array.isArray(s.log)) return null;
    return {plan:s.plan, log:s.log, water:s.water || {}};
  } catch(e){ return null; }
}
function copyText(text, cb){
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function(){ cb(true); }, function(){ cb(fallback()); });
  } else cb(fallback());
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand('copy'); } catch(e){}
    document.body.removeChild(ta); return ok;
  }
}

/* ==================================================================== *
 *  AI logging — you describe or photograph the food, Claude returns the
 *  numbers. The call goes from this page straight to Anthropic with the
 *  key you saved; there is no server in between. Raw fetch rather than
 *  the SDK because this file has to stay dependency-free and work offline.
 * ==================================================================== */
var AIKEY = 'macrotracker.apikey';
var API = 'https://api.anthropic.com/v1/messages';
var MODEL = 'claude-opus-5';
var pendingText = '', pendingPhoto = null, aiBusy = false, aiMessage = null;

function apiKey(){
  try { return localStorage.getItem(AIKEY) || ''; } catch(e){ return ''; }
}
function mealForNow(){
  var h = new Date().getHours();
  return h < 11 ? 'breakfast' : h < 15 ? 'lunch' : h < 21 ? 'dinner' : 'snacks';
}

// Phone photos are far larger than the estimate needs; shrink before sending.
function shrinkImage(fileObj, cb){
  var reader = new FileReader();
  reader.onerror = function(){ cb(null, true); };
  reader.onload = function(){
    var img = new Image();
    img.onerror = function(){ cb(null, true); };
    img.onload = function(){
      var max = 1024, w = img.width, h = img.height;
      var s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      var url = c.toDataURL('image/jpeg', 0.85);
      cb({dataUrl: url, mediaType: 'image/jpeg', base64: url.split(',')[1]});
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(fileObj);
}

};

function coachSystem(){
  var now = new Date();
  return 'You estimate nutrition for a personal food diary. Given a description or a photo of a meal, ' +
    'return one entry per distinct food with its calories and macros for the amount actually eaten.\n\n' +
    'Estimate from standard reference (USDA-style) values. Be decisive: give one best number per item, ' +
    'never a range. If a photo is ambiguous about portion size, assume a normal serving and say so in one ' +
    'short line in "note". Keep item names in the language the user wrote in.\n\n' +
    'The local time is ' + now.toLocaleTimeString() + '. Use it to pick the meal unless the user says which ' +
    'meal it was ("desayuno", "for dinner", "as a snack") — then follow the user.';
}

function estimateFood(cb){
  var key = apiKey();
  var content = [];
  if (pendingPhoto) content.push({
    type: 'image',
    source: {type: 'base64', media_type: pendingPhoto.mediaType, data: pendingPhoto.base64}
  });
  content.push({type: 'text', text: pendingText.trim() ||
    'Log the food in this photo. Estimate each item and the portion sizes you can see.'});

  fetch(API, {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      // required for calls made straight from a browser page
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 4000,
      system: coachSystem(),
      // low effort: this is a quick lookup, not a reasoning problem
      output_config: {effort: 'low', format: {type: 'json_schema', schema: FOOD_SCHEMA}},
      messages: [{role: 'user', content: content}]
    })
  }).then(function(res){
    return res.json().then(function(body){ return {status: res.status, body: body}; });
  }).then(function(r){
    if (r.status !== 200) {
      var m = (r.body && r.body.error && r.body.error.message) || ('HTTP ' + r.status);
      if (r.status === 401) m = 'That API key was rejected. Check it under Coach setup.';
      if (r.status === 429) m = 'Rate limited by the API — try again in a moment.';
      if (r.status === 529) m = 'The API is busy right now — try again in a moment.';
      return cb(null, m);
    }
    if (r.body.stop_reason === 'refusal') return cb(null, 'The model declined that one. Try rewording it.');
    var text = (r.body.content || []).filter(function(b){ return b.type === 'text'; })
                                     .map(function(b){ return b.text; }).join('');
    var parsed;
    try { parsed = JSON.parse(text); } catch(e){ return cb(null, 'Got an unreadable answer back. Try again.'); }
    if (!parsed || !parsed.items || !parsed.items.length) return cb(null, 'No food found in that. Try describing it.');
    cb(parsed, null);
  }).catch(function(){
    cb(null, navigator.onLine === false
      ? 'You’re offline. Estimates need a connection — or enter the numbers yourself.'
      : 'Couldn’t reach the API. Check your connection and try again.');
  });
}

function logWithCoach(){
  if (aiBusy) return;
  if (!apiKey()) {
    aiMessage = {bad:true, html:'Add your API key under <b>Coach setup</b> below to log by description or photo.'};
    render(); return;
  }
  if (!pendingText.trim() && !pendingPhoto) {
    aiMessage = {bad:true, html:'Describe what you ate, or attach a photo.'};
    render(); return;
  }

  aiBusy = true; aiMessage = null; render();

  estimateFood(function(result, err){
    aiBusy = false;
    if (err) { aiMessage = {bad:true, html:esc(err)}; render(); return; }

    var added = 0, cals = 0;
    result.items.forEach(function(it){
      var meal = MEALS.some(function(m){ return m.k === it.meal; }) ? it.meal : mealForNow();
      state.log.push({
        id: 'a' + Date.now().toString(36) + (added++),
        date: selected,
        meal: meal,
        name: String(it.name || 'Food'),
        serving: String(it.serving || '1 serving'),
        cal: Math.max(0, Math.round(+it.cal || 0)),
        p: Math.max(0, Math.round(+it.p || 0)),
        c: Math.max(0, Math.round(+it.c || 0)),
        f: Math.max(0, Math.round(+it.f || 0))
      });
      cals += Math.max(0, Math.round(+it.cal || 0));
    });

    aiMessage = {
      html: 'Logged <b>' + added + (added === 1 ? ' item' : ' items') + '</b>, ' +
            cals.toLocaleString() + ' cal.' + (result.note ? ' ' + esc(result.note) : '')
    };
    pendingText = ''; pendingPhoto = null;
    save(); render();
  });
}

/* ---------------- install as an app ---------------- */
var deferredPrompt = null, INSTALLKEY = 'macrotracker.installdismissed';

function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
         window.navigator.standalone === true;
}
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function installDismissed(){
  try { return localStorage.getItem(INSTALLKEY) === '1'; } catch(e){ return false; }
}

function markAppMode(){
  document.documentElement.classList.toggle('app-mode', isStandalone());
}

function installPromo(){
  if (isStandalone() || installDismissed()) return null;
  var iosOnly = !deferredPrompt && isIOS();
  if (!deferredPrompt && !iosOnly) return null;

  var card = el('<div class="card install">' +
    '<div class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg></div>' +
    '<div class="tx"><b>Install on your phone</b><span>' +
      (iosOnly ? 'Tap Share, then “Add to Home Screen.”'
               : 'Runs full screen and works offline.') +
    '</span></div>' +
    (iosOnly ? '' : '<button id="doinstall">Install</button>') +
    '<button class="no" id="noinstall" title="Dismiss">✕</button>' +
  '</div>');

  card.querySelector('#noinstall').onclick = function(){
    try { localStorage.setItem(INSTALLKEY, '1'); } catch(e){}
    render();
  };
  var go = card.querySelector('#doinstall');
  if (go) go.onclick = function(){
    var p = deferredPrompt;
    deferredPrompt = null;
    p.prompt();
    p.userChoice.then(function(r){
      if (r.outcome === 'accepted') toast('Installing…');
      render();
    });
  };
  return card;
}

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  render();
});
window.addEventListener('appinstalled', function(){
  deferredPrompt = null;
  markAppMode();
  toast('Installed');
  render();
});
if (window.matchMedia) {
  var mq = window.matchMedia('(display-mode: standalone)');
  (mq.addEventListener ? mq.addEventListener.bind(mq,'change') : mq.addListener.bind(mq))(function(){
    markAppMode(); render();
  });
}

/* ---------------- boot ---------------- */
markAppMode();
initTheme();
state = load();
render();

// Service worker: needs http(s) and a top-level page, so it quietly sits out
// file:// and embedded previews. Everything above works without it.
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0 && window.top === window.self) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

// keep the header icon honest if something outside the page flips the theme
if (window.MutationObserver) {
  new MutationObserver(function(){
    if (document.documentElement.getAttribute('data-theme') !== lastTheme) render();
  }).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
}

tickStatus();
setInterval(tickStatus, 20000);
</script>
